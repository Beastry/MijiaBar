# 签名与公证后仅创建草稿；发布和更新 Pages 由维护者完成。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v; empty = docs/VERSION
        required: false
        type: string
      draft-release:
        description: Attach notarized assets to a draft release (never publish)
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.sh
      - scripts/generate-appcast.sh
      - scripts/verify-app-bundle.sh
      - scripts/fetch-sparkle.sh

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      mode: ${{ steps.package.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=${INPUT_VERSION:-$(cat docs/VERSION)}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Expected version x.y.z without leading v"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Secret scan
        run: scripts/scan-secrets.sh
      - name: Detect credentials
        id: creds
        env:
          EVENT: ${{ github.event_name }}
          P12: ${{ github.event_name == 'workflow_dispatch' && secrets.DEVELOPER_ID_P12_BASE64 || '' }}
          P12_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.DEVELOPER_ID_P12_PASSWORD || '' }}
          IDENTITY: ${{ github.event_name == 'workflow_dispatch' && secrets.DEVELOPER_ID_IDENTITY || '' }}
          ASC_KEY_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.ASC_API_KEY_ID || '' }}
          ASC_ISSUER: ${{ github.event_name == 'workflow_dispatch' && secrets.ASC_API_ISSUER_ID || '' }}
          ASC_P8: ${{ github.event_name == 'workflow_dispatch' && secrets.ASC_API_KEY_P8_BASE64 || '' }}
        run: |
          set -euo pipefail
          sign=false notarize=false
          if [[ "$EVENT" == pull_request ]]; then
            echo "::notice::Pull request: ad-hoc dry run, no secrets used."
          elif [[ -n "$P12" && -n "$P12_PASSWORD" && -n "$IDENTITY" ]]; then
            sign=true
            if [[ -n "$ASC_KEY_ID" && -n "$ASC_ISSUER" && -n "$ASC_P8" ]]; then
              notarize=true
            else
              echo "::warning::ASC secrets incomplete: signed but not notarized; no draft release."
            fi
          else
            echo "::warning::Signing secrets incomplete: ad-hoc dry run only."
          fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
      - name: Import signing certificate
        if: steps.creds.outputs.sign == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ -n "$TEAM_ID" && "$IDENTITY" == "Developer ID Application: "*" ($TEAM_ID)" ]] || { echo "::error::Identity must end with (APPLE_TEAM_ID)"; exit 1; }
          keychain="$RUNNER_TEMP/mijiabar-signing.keychain-db"
          password=${KEYCHAIN_PASSWORD:-$(openssl rand -hex 24)}
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          p12="$RUNNER_TEMP/developer-id.p12"
          (umask 077; printf '%s' "$P12" | base64 --decode > "$p12")
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          rm -f "$p12"
          # 补齐 G2 中间证书，下载内容必须匹配固定哈希。
          if ! security find-certificate -c "Developer ID Certification Authority" -Z \
            /Library/Keychains/System.keychain /System/Library/Keychains/SystemRootCertificates.keychain 2>/dev/null \
            | grep -qi F16CD3C54C7F83CEA4BF1A3E6A0819C8AAA8E4A1528FD144715F350643D2DF3A; then
            ca="$RUNNER_TEMP/DeveloperIDG2CA.cer"
            curl -fsSL -o "$ca" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            echo "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  $ca" | shasum -a 256 --check --status
            security import "$ca" -k "$keychain"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # 保留原搜索列表，并在清理时恢复。
          security list-keychains -d user > "$RUNNER_TEMP/mijiabar-keychains.txt"
          keychains=()
          while IFS= read -r entry; do
            entry=${entry#*\"}; entry=${entry%\"*}
            keychains+=("$entry")
          done < "$RUNNER_TEMP/mijiabar-keychains.txt"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          security find-identity -v -p codesigning "$keychain" | grep -F "\"$IDENTITY\"" >/dev/null \
            || { echo "::error::Requested signing identity is not valid in the temporary keychain"; exit 1; }
      - name: Prepare notarization key
        if: steps.creds.outputs.notarize == 'true'
        env:
          ASC_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          chmod 700 "$RUNNER_TEMP/asc"
          (umask 077; printf '%s' "$ASC_P8" | base64 --decode > "$RUNNER_TEMP/asc/key.p8")
          grep -q '^-----BEGIN PRIVATE KEY-----$' "$RUNNER_TEMP/asc/key.p8"
          grep -q '^-----END PRIVATE KEY-----$' "$RUNNER_TEMP/asc/key.p8"
      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGN: ${{ steps.creds.outputs.sign }}
          NOTARIZE: ${{ steps.creds.outputs.notarize }}
          IDENTITY: ${{ steps.creds.outputs.sign == 'true' && secrets.DEVELOPER_ID_IDENTITY || '' }}
          ASC_API_KEY_ID: ${{ steps.creds.outputs.notarize == 'true' && secrets.ASC_API_KEY_ID || '' }}
          ASC_API_ISSUER_ID: ${{ steps.creds.outputs.notarize == 'true' && secrets.ASC_API_ISSUER_ID || '' }}
          SKIP_APPCAST: '1'
          NOTARY_PROFILE: ''
        run: |
          set -euo pipefail
          mode=adhoc
          export SIGN_IDENTITY=-
          if [[ "$SIGN" == true ]]; then
            mode=signed
            export SIGN_IDENTITY="$IDENTITY" KEYCHAIN="$RUNNER_TEMP/mijiabar-signing.keychain-db"
            if [[ "$NOTARIZE" == true ]]; then
              mode=notarized
              export ASC_API_KEY_PATH="$RUNNER_TEMP/asc/key.p8" REQUIRE_NOTARIZATION=1
            fi
          fi
          scripts/package.sh
          (cd dist; shasum -a 256 ./*.dmg > "MijiaBar-$VERSION.sha256")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Generate Sparkle appcast
        if: steps.package.outputs.mode == 'notarized'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY missing: no appcast artifact; no automatic update feed generated."
            exit 0
          fi
          export SPARKLE_KEY="$RUNNER_TEMP/mijiabar-sparkle.key"
          (umask 077; printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$SPARKLE_KEY")
          export DOWNLOAD_URL="https://github.com/Beastry/MijiaBar/releases/download/v$VERSION/MijiaBar-$VERSION.dmg"
          scripts/generate-appcast.sh
          cp docs/appcast.xml dist/appcast.xml
      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MijiaBar-${{ steps.version.outputs.version }}-${{ steps.package.outputs.mode || 'failed' }}
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/appcast.xml
            dist/notary.log
          if-no-files-found: warn
      - name: Remove keychain and keys
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/mijiabar-keychains.txt" ]]; then
            keychains=()
            while IFS= read -r entry; do
              entry=${entry#*\"}; entry=${entry%\"*}
              keychains+=("$entry")
            done < "$RUNNER_TEMP/mijiabar-keychains.txt"
            security list-keychains -d user -s "${keychains[@]}" || true
          fi
          security delete-keychain "$RUNNER_TEMP/mijiabar-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc"
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            "$RUNNER_TEMP/mijiabar-sparkle.key" "$RUNNER_TEMP/mijiabar-keychains.txt" \
            "$RUNNER_TEMP/mijiabar-signing.keychain-db"

  draft-release:
    needs: package
    if: github.event_name == 'workflow_dispatch' && inputs.draft-release && needs.package.outputs.mode == 'notarized'
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: MijiaBar-${{ needs.package.outputs.version }}-notarized
          path: dist
      - name: Draft GitHub release (never published)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          assets=("dist/MijiaBar-$VERSION.dmg" "dist/MijiaBar-$VERSION.sha256")
          [[ ! -f dist/appcast.xml ]] || assets+=(dist/appcast.xml)
          if state=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            [[ "$state" == true ]] || { echo "::error::Release $tag is already published; refusing to modify it"; exit 1; }
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            notes=(--notes "MijiaBar $VERSION")
            [[ ! -f "docs/release-notes/v$VERSION.md" ]] || notes=(--notes-file "docs/release-notes/v$VERSION.md")
            gh release create "$tag" "${assets[@]}" --draft --target "$GITHUB_SHA" \
              --title "MijiaBar $VERSION" "${notes[@]}"
          fi
          echo "::notice::Draft $tag ready for human review. No release published or tag pushed."
